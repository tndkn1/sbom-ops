name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "rockylinux/rockylinux:9", "rockylinux/rockylinux:8"]
    container: ${{ matrix.image }}
    steps:
      - name: prerequisites
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq python3 python3-yaml curl ca-certificates git >/dev/null
          elif grep -q 'VERSION_ID="8' /etc/os-release; then
            dnf -y -q install python39 python39-pyyaml git >/dev/null
            echo "SBOMOPS_PYTHON=python3.9" >> "$GITHUB_ENV"
          else
            dnf -y -q install python3 python3-pyyaml git >/dev/null
          fi
      - uses: actions/checkout@v4
      - name: unit tests
        run: ${SBOMOPS_PYTHON:-python3} -m unittest discover -s tests -t . -v
      - name: smoke (real syft + trivy, os-packages)
        run: |
          scripts/install-tools.sh "$PWD/.tools"
          cat > /tmp/smoke.yaml <<'EOF'
          data_dir: /tmp/sbomops-data
          secrets_file: ""
          notify: {suppress_file: ""}
          targets:
            - {id: os, type: os-packages}
            - {id: usr-bin, type: dir, path: /usr/bin}
          EOF
          bin/sbomops -c /tmp/smoke.yaml run --dry-run > /tmp/payload.json
          ${SBOMOPS_PYTHON:-python3} -c 'import json; d=json.load(open("/tmp/payload.json")); print(d["text"])'
          bin/sbomops -c /tmp/smoke.yaml status

  # spec/ の期待値が Python 版の出力と一致しているか (Python 版を直したら spec/gen.py で更新する)
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml >/dev/null
      - name: spec の期待値が最新か
        run: |
          python3 spec/gen.py
          git diff --exit-code spec/ || { echo "::error::spec/ の期待値が古い。python3 spec/gen.py を実行してコミットしてください"; exit 1; }

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: unit tests (spec/ の共通データ)
        run: go test -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o sbomops-go ./cmd/sbomops-go

  # 本物の syft / trivy で両方を動かし、Slack のペイロードと状態 DB が同じになることを確かめる
  compare:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml >/dev/null
      - name: build
        run: cd go && go build -o /tmp/sbomops-go ./cmd/sbomops-go
      - name: run both
        run: |
          scripts/install-tools.sh "$PWD/.tools"
          for impl in py go; do
            cat > /tmp/cmp-$impl.yaml <<EOF
          data_dir: /tmp/cmp-data-$impl
          secrets_file: ""
          tools: {syft: $PWD/.tools/syft, trivy: $PWD/.tools/trivy}
          notify:
            suppress_file: ""
            policy: {min_severity: LOW, only_fixable: false, notify_reboot_required: false}
          targets:
            - {id: os, type: os-packages}
            - {id: usr-bin, type: dir, path: /usr/bin}
            - {id: disabled, type: dir, path: /x, enabled: false}
          EOF
          done
          bin/sbomops -c /tmp/cmp-py.yaml run --dry-run > /tmp/cmp-py.json
          /tmp/sbomops-go -c /tmp/cmp-go.yaml run --dry-run > /tmp/cmp-go.json
          python3 scripts/compare-impl.py /tmp/cmp-py.json /tmp/cmp-go.json /tmp/cmp-data-py/state.db /tmp/cmp-data-go/state.db

  # コンテナイメージ (Go 版 + syft + trivy)。試験に通ったら main と v* タグで ghcr.io に push する
  image:
    runs-on: ubuntu-latest
    needs: [test, go, spec, compare]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build (amd64、試験用)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sbomops:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke (コンテナからホストを調べた結果が、ネイティブの Python 版と同じか)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml >/dev/null
          scripts/install-tools.sh "$PWD/.tools"
          cat > /tmp/targets.yaml <<'EOF'
          notify:
            suppress_file: ""
            policy: {min_severity: LOW, only_fixable: false, notify_reboot_required: false}
          targets:
            - {id: os, type: os-packages}
            - {id: usr-bin, type: dir, path: /usr/bin}
            - {id: opt, type: dir, path_glob: "/opt/*"}
            - {id: disabled, type: dir, path: /x, enabled: false}
          EOF
          { echo "data_dir: /tmp/smoke-py"; echo 'secrets_file: ""'
            echo "tools: {syft: $PWD/.tools/syft, trivy: $PWD/.tools/trivy}"; cat /tmp/targets.yaml; } > /tmp/py.yaml
          { echo "data_dir: /var/lib/sbomops"; echo 'secrets_file: ""'; cat /tmp/targets.yaml; } > /tmp/ct.yaml
          bin/sbomops -c /tmp/py.yaml run --dry-run > /tmp/py.json
          docker volume create smoke-ct
          docker run --rm -v /:/host:ro -v smoke-ct:/var/lib/sbomops -v /tmp/ct.yaml:/etc/sbomops/config.yaml:ro \
            sbomops:test run --dry-run > /tmp/ct.json
          docker run --rm --entrypoint cat -v smoke-ct:/d sbomops:test /d/state.db > /tmp/ct.db
          python3 scripts/compare-impl.py /tmp/py.json /tmp/ct.json /tmp/smoke-py/state.db /tmp/ct.db
          # /host を付け忘れたら分かるエラーで止まること
          ! docker run --rm sbomops:test targets 2> /tmp/err.txt
          grep -q "host_root /host がない" /tmp/err.txt
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
