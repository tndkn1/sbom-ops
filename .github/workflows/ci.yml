name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "rockylinux/rockylinux:9", "rockylinux/rockylinux:8"]
    container: ${{ matrix.image }}
    steps:
      - name: prerequisites
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq python3 python3-yaml curl ca-certificates git >/dev/null
          elif grep -q 'VERSION_ID="8' /etc/os-release; then
            dnf -y -q install python39 python39-pyyaml git >/dev/null
            echo "SBOMOPS_PYTHON=python3.9" >> "$GITHUB_ENV"
          else
            dnf -y -q install python3 python3-pyyaml git >/dev/null
          fi
      - uses: actions/checkout@v4
      - name: unit tests
        run: ${SBOMOPS_PYTHON:-python3} -m unittest discover -s tests -t . -v
      - name: smoke (real syft + trivy, os-packages)
        run: |
          scripts/install-tools.sh "$PWD/.tools"
          cat > /tmp/smoke.yaml <<'EOF'
          data_dir: /tmp/sbomops-data
          secrets_file: ""
          notify: {suppress_file: ""}
          targets:
            - {id: os, type: os-packages}
            - {id: usr-bin, type: dir, path: /usr/bin}
          EOF
          bin/sbomops -c /tmp/smoke.yaml run --dry-run > /tmp/payload.json
          ${SBOMOPS_PYTHON:-python3} -c 'import json; d=json.load(open("/tmp/payload.json")); print(d["text"])'
          bin/sbomops -c /tmp/smoke.yaml status
